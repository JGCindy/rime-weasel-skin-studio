<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="小狼毫皮肤工作室">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#FCE3E6"/><stop offset="1" stop-color="#ECAFB8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- 剪纸装饰：左上角星芒、小圆点 -->
  <path d="M13 10.4c.5 3.2 1.4 4.1 4.6 4.6-3.2.5-4.1 1.4-4.6 4.6-.5-3.2-1.4-4.1-4.6-4.6 3.2-.5 4.1-1.4 4.6-4.6Z" fill="#26232B"/>
  <circle cx="23.5" cy="14.5" r="1.4" fill="#26232B"/>

  <!-- 猫剪影：伸懒腰（头低、背拱、臀高、尾上扬） -->
  <g fill="none" stroke="#26232B" stroke-linecap="round">
    <!-- 身体：肩部拱到臀部 -->
    <path d="M26 41.5 Q29.5 26.5 45 30" stroke-width="14"/>
    <!-- 前腿（伸向前方，贴地，位于下巴下方） -->
    <path d="M22 51.5 L8.5 54" stroke-width="4.4"/>
    <path d="M25 53.5 L12 56.2" stroke-width="3.8"/>
    <!-- 后腿 -->
    <path d="M45 37 L50 50" stroke-width="6"/>
    <!-- 尾巴上扬 -->
    <path d="M47.5 28.5 Q60 23.5 55 9.5" stroke-width="3.8"/>
  </g>
  <!-- 前爪 / 后爪 -->
  <ellipse cx="7.8" cy="54.3" rx="2.5" ry="1.9" fill="#26232B"/>
  <ellipse cx="11.5" cy="56.4" rx="2.3" ry="1.8" fill="#26232B"/>
  <ellipse cx="51" cy="51.6" rx="3.4" ry="2.4" fill="#26232B"/>

  <!-- 头 + 耳朵 -->
  <circle cx="19.5" cy="43.5" r="7.2" fill="#26232B"/>
  <path d="M14.5 38.5 L12 30.5 L20.5 36.5 Z" fill="#26232B"/>
  <path d="M23.5 37.5 L27 30.5 L28 38.5 Z" fill="#26232B"/>

  <!-- 胡须（剪纸小条） -->
  <g stroke="#26232B" stroke-width="1.4" stroke-linecap="round">
    <path d="M12.5 44.5 L6 43"/>
    <path d="M12.5 47 L6 48"/>
  </g>

  <!-- 镂空：眼睛、背部圆点、臀部月牙、尾尖 -->
  <g fill="url(#bg)">
    <circle cx="16.5" cy="42.5" r="1.6"/>
    <circle cx="32.5" cy="30.8" r="1.2"/>
    <circle cx="38.5" cy="29.4" r="1.2"/>
    <circle cx="47.2" cy="33.8" r="2.5"/>
  </g>
  <circle cx="48.9" cy="32.6" r="2.5" fill="#26232B"/>
  <circle cx="55.3" cy="9.8" r="1.9" fill="url(#bg)"/>
</svg>
