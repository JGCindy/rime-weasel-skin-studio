<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="小狼毫皮肤工作室">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCE3E6"/><stop offset="1" stop-color="#ECAFB8"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6455F"/><stop offset="1" stop-color="#9E2740"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- 尾巴＝画笔杆 -->
  <path d="M40.5 52.5 Q54.5 51 52.8 36.5" fill="none" stroke="#322F38" stroke-width="5" stroke-linecap="round"/>
  <!-- 画笔笔尖（尾巴末端） -->
  <path d="M49.4 39 L56.2 39 L52.8 27.5 Z" fill="url(#tip)"/>
  <!-- 身体 -->
  <path d="M16.8 55 Q14.5 41 27 38.5 L31 38.5 Q43.5 41 41.2 55 Z" fill="#322F38"/>
  <!-- 耳朵 -->
  <path d="M18.6 19.5 L16.2 7.8 L27 14.2 Z" fill="#322F38"/>
  <path d="M39.4 19.5 L41.8 7.8 L31 14.2 Z" fill="#322F38"/>
  <path d="M19.4 17.2 L18.2 11 L24.4 14.6 Z" fill="#D98F9C"/>
  <path d="M38.6 17.2 L39.8 11 L33.6 14.6 Z" fill="#D98F9C"/>
  <!-- 头 -->
  <circle cx="29" cy="27" r="13" fill="#322F38"/>
  <!-- 眼睛 -->
  <circle cx="24.5" cy="26" r="2" fill="#FCE3E6"/>
  <circle cx="33.5" cy="26" r="2" fill="#FCE3E6"/>
  <!-- 鼻子 -->
  <path d="M27.4 30.6 h3.2 L29 33.2 Z" fill="#ECAFB8"/>
  <!-- 胡须 -->
  <g stroke="#322F38" stroke-width="1.3" stroke-linecap="round" opacity=".75">
    <path d="M17.5 28.5 L11.5 27"/>
    <path d="M17.8 31.5 L11.5 32"/>
    <path d="M40.5 28.5 L46.5 27"/>
    <path d="M40.2 31.5 L46.5 32"/>
