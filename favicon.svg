<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="小狼毫皮肤工作室">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#FCE3E6"/><stop offset="1" stop-color="#ECAFB8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- 剪纸装饰：左上角星芒、小圆点 -->
  <path d="M13 9.4c.5 3.2 1.4 4.1 4.6 4.6-3.2.5-4.1 1.4-4.6 4.6-.5-3.2-1.4-4.1-4.6-4.6 3.2-.5 4.1-1.4 4.6-4.6Z" fill="#26232B"/>
  <circle cx="23.5" cy="13.5" r="1.4" fill="#26232B"/>

  <!-- 剪纸地线 -->
  <path d="M5.5 56 H56.5" stroke="#26232B" stroke-width="2" stroke-linecap="round"/>

  <!-- 猫剪影：伸懒腰（前爪远伸贴地、下巴贴地、背斜上、尾大弯钩） -->
  <g fill="none" stroke="#26232B" stroke-linecap="round">
    <!-- 身体：肩部斜上到臀部 -->
    <path d="M27 41.5 Q34 26.5 46 30" stroke-width="13"/>
    <!-- 前腿（远远伸向前方） -->
    <path d="M24 47.5 L8 53" stroke-width="4.4"/>
    <path d="M26 50.5 L11 55" stroke-width="3.6"/>
    <!-- 后腿（从臀部垂直向下） -->
    <path d="M45.5 36 L47.8 50.5" stroke-width="5.6"/>
    <!-- 尾巴大弯钩上扬 -->
    <path d="M46.5 28.5 C58.5 24 60 13.5 53.5 9" stroke-width="3.8"/>
  </g>
  <!-- 前爪 / 后爪（落在地线上） -->
  <ellipse cx="7.2" cy="53.4" rx="2.5" ry="1.9" fill="#26232B"/>
  <ellipse cx="10.4" cy="55.2" rx="2.3" ry="1.8" fill="#26232B"/>
  <ellipse cx="48.6" cy="52.8" rx="3.2" ry="2.3" fill="#26232B"/>

  <!-- 头（低垂贴地）+ 耳朵 -->
  <circle cx="16.5" cy="44.5" r="7" fill="#26232B"/>
  <path d="M12.6 39.5 L10 31.5 L18.5 37 Z" fill="#26232B"/>
  <path d="M20.5 38 L24 30.5 L25 38.5 Z" fill="#26232B"/>

  <!-- 胡须（剪纸小条） -->
  <g stroke="#26232B" stroke-width="1.4" stroke-linecap="round">
    <path d="M10 42.5 L3.8 41"/>
    <path d="M10 45 L3.8 46"/>
  </g>

  <!-- 镂空：眼睛、背圆点、臀月牙、尾尖 -->
  <g fill="url(#bg)">
    <circle cx="13.5" cy="43.5" r="1.5"/>
    <circle cx="33" cy="30" r="1.2"/>
    <circle cx="39" cy="28.6" r="1.2"/>
    <circle cx="47.3" cy="32.5" r="2.4"/>
  </g>
  <circle cx="48.8" cy="31.3" r="2.4" fill="#26232B"/>
  <circle cx="53.6" cy="9.2" r="1.8" fill="url(#bg)"/>
</svg>
