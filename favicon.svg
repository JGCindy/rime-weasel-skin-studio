<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="小狼毫皮肤工作室">
  <!-- 小狼毫皮肤工作室 · 站点图标
       狼毫笔（墨色笔杆 + 蘸玫瑰色的笔头）落在千禧粉色底上，
       呼应工具名「小狼毫」与默认主题「千禧粉」。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCE3E6"/>
      <stop offset="1" stop-color="#ECAFB8"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6455F"/>
      <stop offset="1" stop-color="#9E2740"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <g transform="rotate(-38 32 32)">
    <rect x="23.6" y="7" width="16.8" height="29" rx="5" fill="#322F38"/>
    <rect x="25.6" y="9.6" width="3.2" height="21" rx="1.6" fill="#57525E"/>
    <path d="M23.6 35.4h16.8l-4.4 13.4q-4 7.6-8 0Z" fill="url(#tip)"/>
  </g>
</svg>
